<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      html, body, #root { margin: 0; background: #000; min-height: 100%; }
    </style>
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Proverbs of the World</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        function device() {
          var ua = navigator.userAgent || "";
          var touchMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
          var pad = /iPad/.test(ua) || touchMac;
          var phone = /iPhone|iPod/.test(ua);
          var android = /Android/.test(ua);
          var w = window.innerWidth;
          var h = window.innerHeight;
          var shortSide = Math.min(w, h);
          var fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
          var kind = "iphone";
          if (phone || (android && shortSide < 600)) kind = "iphone";
          else if (pad || (android && w <= h)) kind = "ipad";
          else if (android && w > h) kind = "mac";
          else if (fine && w >= 1000) kind = "mac";
          else if (shortSide >= 744) kind = "ipad";
          else if (w >= 1100) kind = "mac";
          document.documentElement.dataset.device = kind;
          document.documentElement.dataset.orient = w > h ? "land" : "port";
        }
        device();
        window.addEventListener("resize", device);
        window.addEventListener("orientationchange", device);
      })();
    </script>
    <script type="module" crossorigin src="./assets/oyna-IMxXi8bI.js"></script>

    <link rel="stylesheet" crossorigin href="./assets/styles-Bsrg5k5R.css">
  </head>

  </body>
</html>
